services:
  web:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: sh -c "bun install && bunx vite --host 0.0.0.0 --port 5173"

volumes:
  node_modules:
